<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="동물보호센터의 주요 활동과 보호 동물 정보를 소개합니다. 입양 절차부터 지역별 보호센터 및 상담 안내까지, 도움이 필요한 동물들이 새로운 가족을 만날 수 있도록 다양한 정보를 제공합니다."
    />
    <meta name="keywords" content="동물보호센터, 동물보육원, 유기동물, 동물보호, 반려동물, 입양, 보호동물" />
    <meta name="author" content="Animal Shelter" />
    <title>Animal Shelter | 동물보호센터</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/common.css" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
    <script src="./js/main.js" defer></script>
  </head>
  <body>
    <header class="header">
      <div class="container header-inner">
        <!-- Logo -->
        <a href="#home" class="header-logo">
          <span class="logo-en">FAMILY</span>
          <span class="logo-ko">동물보호센터</span>
        </a>

        <!-- Navigation -->
        <nav class="header-nav" id="primary-navigation" aria-label="주 메뉴">
          <ul class="nav-list">
            <li><a href="#about">센터 소개</a></li>
            <li><a href="#activities">주요 활동</a></li>
            <li><a href="#animals">보호 동물</a></li>
            <li><a href="#adoption">입양 안내</a></li>
            <li><a href="#contact">지부 안내</a></li>
          </ul>
        </nav>

        <!-- Mobile Menu -->
        <button
          type="button"
          class="menu-toggle"
          aria-label="메뉴 열기"
          aria-expanded="false"
          aria-controls="primary-navigation"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <!-- Main -->
    <main>
      <!-- Hero Section -->
      <section id="home" class="hero">
        <div class="container hero-inner">
          <!-- Hero Content -->
          <div class="hero-content">
            <p class="hero-eyebrow">FAMILY Animal Shelter</p>

            <h1 class="hero-title">
              새로운 가족을 만나는<br />
              <span>따뜻한 시작</span>
            </h1>

            <p class="hero-description">
              FAMILY 동물보호센터는 도움이 필요한 동물들에게 안전한 보금자리를 제공하고, 새로운 가족을 만날 수 있도록
              함께합니다.
            </p>

            <div class="hero-actions">
              <a href="#animals" class="hero-button hero-button-primary"> 보호 동물 만나기 </a>

              <a href="#about" class="hero-button hero-button-secondary"> 센터 소개 </a>
            </div>
          </div>

          <!-- Hero Image -->
          <div class="hero-visual">
            <!-- 이미지 추가 예정 -->
            <!--
  <img
    src="./assets/images/hero.jpg"
    alt="함께 있는 강아지와 고양이"
    class="hero-image"
  />
  -->
          </div>
        </div>
      </section>

      <!-- About Section -->
      <section id="about" class="about"></section>

      <!-- Activities Section -->
      <section id="activities" class="activities"></section>

      <!-- Animals Section -->
      <section id="animals" class="animals"></section>

      <!-- Adoption Section -->
      <section id="adoption" class="adoption"></section>

      <!-- Contact Section -->
      <section id="contact" class="contact"></section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <!-- Organization Information -->
    </footer>
  </body>
</html>
